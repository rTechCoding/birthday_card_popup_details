<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎉</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- Floating Bubbles Animation --- */
        .bubble-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(255, 255, 255, 0.4); /* Slightly softer transparency */
            border-radius: 50%;
            animation: floatUp 8s infinite ease-in;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.3); opacity: 0; }
        }

        /* --- Image Gallery Card Styling --- */
        .gallery-container {
            position: relative;
            z-index: 1;
        }
        .birthday-card {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            /* Explicit fallback initialization for smooth reverse animations */
            transform: translateY(0) scale(1); 
            -webkit-tap-highlight-color: transparent; /* Clean mobile tap highlight */
        }
        
        /* Handles hover states cleanly on desktop devices */
        @media (hover: hover) {
            .birthday-card:hover {
                transform: translateY(-10px) scale(1.02);
                box-shadow: 0 15px 30px rgba(244, 43, 103, 0.3);
            }
            .birthday-card:hover img {
                transform: scale(1.1);
            }
            .birthday-card:hover .heart-overlay {
                opacity: 1;
            }
        }
        
        /* Smooth dynamic response for touch screen instant states */
        .birthday-card:active {
            transform: scale(0.98);
        }

        .birthday-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        /* --- Heart Overlay Animation --- */
        .heart-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(244, 43, 103, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .heart-icon {
            font-size: 3rem;
            color: #ff477e;
            animation: pulse 1.2s infinite;
            display: inline-block;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* --- Custom Modal (Popup) Animation --- */
        .modal.fade .modal-dialog {
            transform: scale(0.7);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); /* Snappy bounce curve */
        }
        .modal.show .modal-dialog {
            transform: scale(1);
        }
        .modal-content {
            border-radius: 20px;
            border: none;
            background: linear-gradient(135deg, #ffffff, #fff0f3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="bubble-container" id="bubbleContainer"></div>

    <div class="container py-5 gallery-container">
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold text-danger animate__animated animate__heartBeat animate__infinite">
                ✨ Happy Birthday Memories ✨
            </h1>
            <p class="lead text-muted">Click on any picture to open a special birthday message!</p>
        </div>

        <div class="row g-4 justify-content-center">
            <div class="col-lg-4 col-sm-6 col-12">
                <div class="birthday-card" onclick="openBirthdayModal('To an Incredible Friend!', 'May your day be filled with as much laughter and joy as you bring into my life every single day. Cheers to another year of amazing memories!')" role="button" aria-label="Open birthday card message">
                    <img src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=500&q=80" alt="Birthday Balloons">
                    <div class="heart-overlay">
                        <span class="heart-icon">❤️</span>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 col-sm-6 col-12">
                <div class="birthday-card" onclick="openBirthdayModal('Make a Wish! 🎂', 'Wishing you a year ahead filled with sweet surprises, grand opportunities, and endless success. Keep shining bright like the star you are!')" role="button" aria-label="Open birthday cake message">
                    <img src="https://images.unsplash.com/photo-1533777857889-4be7c70b33f7?auto=format&fit=crop&w=500&q=80" alt="Birthday Cake">
                    <div class="heart-overlay">
                        <span class="heart-icon">💖</span>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 col-sm-6 col-12">
                <div class="birthday-card" onclick="openBirthdayModal('Cheers to You! 🥂', 'Here’s to celebrating YOU! May this new chapter of your life bring you peace, good health, and the courage to chase all your wildest dreams.')" role="button" aria-label="Open celebration message">
                    <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=500&q=80" alt="Celebration Sparklers">
                    <div class="heart-overlay">
                        <span class="heart-icon">💝</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="birthdayModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4 text-center">
                <div class="modal-header border-0 justify-content-center">
                    <h2 class="modal-title fw-bold text-danger" id="modalTitle">Dynamic Title</h2>
                </div>
                <div class="modal-body">
                    <p class="fs-5 text-secondary" id="modalMessage">Dynamic Message</p>
                </div>
                <div class="modal-footer border-0 justify-content-center">
                    <button type="button" class="btn btn-danger px-4 rounded-pill shadow-sm" data-bs-dismiss="modal">Close with Love XOXO</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // --- Generate Floating Bubbles Dynamically ---
        const container = document.getElementById('bubbleContainer');
        const bubbleCount = 20;

        for (let i = 0; i < bubbleCount; i++) {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            
            const size = Math.random() * 40 + 10; 
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${Math.random() * 100}%`;
            bubble.style.animationDelay = `${Math.random() * 8}s`;
            bubble.style.animationDuration = `${Math.random() * 5 + 5}s`; 
            
            container.appendChild(bubble);
        }

        // --- Function to trigger Modal Popup Dynamically ---
        const modalElement = document.getElementById('birthdayModal');
        const myModal = new bootstrap.Modal(modalElement);
        
        function openBirthdayModal(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            myModal.show();
        }
    </script>
</body>
</html>
